name: Build and Push Docker Image

# Publishes to GitHub Container Registry (ghcr.io/<owner>/tidyquest) with the
# built-in GITHUB_TOKEN, so no registry secrets are needed there.
#   push to main      -> :main and :sha-<short>   (staging pulls :main)
#   published release -> :latest, :X.Y.Z, :X.Y, :X (production pins :X.Y.Z, see RELEASING.md)
# Releases from TidyQuest/TidyQuest also go to Docker Hub as tidyquest/tidyquest (same tags), with the
# repo's DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets. Forks and main builds skip Docker Hub.
# Builds from main are labelled "main · <short sha>" (shown in Settings next to the version).

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: docker.io/tidyquest/tidyquest
  DOCKERHUB: ${{ github.event_name == 'release' && github.repository == 'TidyQuest/TidyQuest' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/tidyquest" >> "$GITHUB_ENV"

      - name: Build label (shown in Settings; releases just show their version)
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then echo "APP_BUILD=" >> "$GITHUB_ENV";
          else echo "APP_BUILD=${GITHUB_REF_NAME} · ${GITHUB_SHA::7}" >> "$GITHUB_ENV"; fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (releases from TidyQuest/TidyQuest only)
        if: env.DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            name=${{ env.DOCKERHUB_IMAGE }},enable=${{ env.DOCKERHUB == 'true' }}
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD=${{ env.APP_BUILD }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
